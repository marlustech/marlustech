name: Profile Summary Cards

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 03:00 UTC (00:00 no horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write # permite que o workflow salve os cartões no repositório
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -3 # horário de Brasília
          THEME: "tokyonight" # gera só este tema
